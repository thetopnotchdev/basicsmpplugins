name: Build plugin jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: mvn -B package -f BasicSMP-plugin/pom.xml
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: BasicSMP
          path: BasicSMP-plugin/target/BasicSMP-*.jar
